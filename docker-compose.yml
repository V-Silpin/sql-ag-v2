version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sql-agent-postgres
    environment:
      POSTGRES_USER: sqlagent
      POSTGRES_PASSWORD: sqlagent123
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlagent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sql-agent-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: sql-agent-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # API port
      - "9001:9001"   # Console port
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - sql-agent-network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sql-agent-backend
    environment:
      - PORT=8003
      - DATABASE_URL=postgresql://sqlagent:sqlagent123@postgres:5432/agent_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_SECURE=false
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - sql-agent-network

volumes:
  postgres_data:
  minio_data:

networks:
  sql-agent-network:
    driver: bridge
